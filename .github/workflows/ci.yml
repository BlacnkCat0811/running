name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust-data-worker:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      # CPU inference is bundled; the optional 1.22.0 CUDA downloader is broken.
      ONNXRUNTIME_NODE_INSTALL: skip
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install repository Rust toolchain
        run: rustup show active-toolchain
      - name: Install Node dependencies
        run: npm ci
      - name: Verify native engine, contract parity, cancellation, and real import
        run: npm run rust:verify

  ios:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      # This Xcode/SDK passed run 40130489750; do not follow the image default.
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - name: Verify Xcode and iOS SDK availability
        run: |
          xcodebuild -version
          xcrun swiftc --version
          xcrun --sdk iphonesimulator --show-sdk-path
          python3 --version
          pod --version
      - name: Run iOS gates (typecheck + pure-logic regressions)
        shell: bash
        run: |
          npm run test:ios 2>&1 | tee "$RUNNER_TEMP/ios-gates.log"
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { join } from 'node:path';
          import { NO_IOS_SOURCE_CHECKED } from './scripts/run-ios.mjs';
          const log = readFileSync(join(process.env.RUNNER_TEMP, 'ios-gates.log'), 'utf8');
          if (log.includes(NO_IOS_SOURCE_CHECKED) || !log.includes('iOS 门禁通过（类型检查 + 纯逻辑回归）')) {
            throw new Error('Required iOS CI gates did not execute');
          }
          NODE
      - name: Run cross-platform source gates
        run: npm run check:ios-gates
      - name: Cache CocoaPods
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-${{ runner.arch }}-pods-${{ hashFiles('apps/ios/Podfile.lock') }}
      - name: Install locked CocoaPods dependencies
        working-directory: apps/ios
        run: pod install --deployment
      - name: Build iOS simulator target
        run: |
          xcodebuild -workspace apps/ios/RAI.xcworkspace -scheme RAI \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/rai-build" \
            CODE_SIGNING_ALLOWED=NO build
      # test:ios already runs run-model-tests.sh and all its nested Swift suites.
      # Compile only: running UI acceptance needs a simulator and private data.
      - name: Compile visual acceptance UI tests
        run: |
          xcodebuild -project apps/ios/tests/VisualAcceptance.xcodeproj -scheme VisualAcceptance \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/visual-acceptance" \
            CODE_SIGNING_ALLOWED=NO build-for-testing

  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      matrix:
        node-version: [22.x]
    env:
      # CPU inference is bundled; the optional 1.22.0 CUDA downloader is broken.
      ONNXRUNTIME_NODE_INSTALL: skip
      RAI_TEST_CONCURRENCY: "2"

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/requirements.lock

      - name: Validate GitHub Actions workflows
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/rhysd/actionlint/releases/download/v1.7.11/actionlint_1.7.11_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/actionlint.tar.gz"
          echo "900919a84f2229bac68ca9cd4103ea297abc35e9689ebb842c6e34a3d1b01b0a  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - name: Check deployment shell syntax
        # Static parsing only; deployment tests use systemctl doubles. Neither
        # constitutes real systemd integration or starts a production service.
        shell: bash
        run: |
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(git ls-files -z -- 'deploy/*.sh')
      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Validate maintained documentation and acceptance references
        run: npm run check:docs && npm run check:doc-refs && npm run check:acceptance-matrix

      - name: Verify gate scripts, blob ceiling, and package boundaries
        run: |
          npm run check:scripts
          node scripts/check-blob-size.mjs
          npm run check:package-boundaries
          npm run check:package-boundaries -- --self-test
          npm run check:training-plan-single-writer
          npm run check:ios-gates

      - name: Model boundary review (R1-R3)
        run: npm run review:model-boundaries

      - name: Run tests
        # Full discovery: SQLite, import lanes, atomic publication and POSIX recovery.
        run: npm test

      - name: Bootstrap Python training environment
        run: npm run ml:bootstrap

      - name: Run Python training tests
        run: npm run ml:test

      - name: Smoke test production API startup and shutdown
        run: npm run smoke:api

      - name: Verify production-only startup contract
        run: |
          npm ci --omit=dev
          test ! -e node_modules/typescript
          test ! -e node_modules/.bin/vite
          test ! -e node_modules/react
          test ! -e node_modules/vitest
          npm run smoke:api
