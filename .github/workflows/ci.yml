name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  rust-data-worker:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.x
          cache: npm
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Install Node dependencies
        run: npm ci
      - name: Verify native engine, contract parity, cancellation, and real import
        run: npm run rust:verify

  ios:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run iOS gates (typecheck + pure-logic regressions)
        # 本仓库远端是 gitee，本 workflow 目前**不会**对远端触发；真正的执行入口是
        # `.githooks/pre-commit`（`apps/ios/` 有改动时跑 `npm run test:ios`）。
        # 这一步是给"将来把仓库镜像到 GitHub"准备的，判据本身与本机完全同一条命令。
        #
        # `run-ios-gates.sh` 自带 macOS / Xcode 检测：不满足时**显式跳过并退出 0**
        # （打印「本次没有检查任何 iOS 源码」），所以这步不会因为 runner 差异静默变绿。
        # runner 上的 Xcode 路径不一定在 /Applications/Xcode.app，按 `xcode-select -p` 传进去。
        run: |
          export DEVELOPER_DIR="$(xcode-select -p)"
          bash apps/ios/tests/run-ios-gates.sh
      - name: Cache CocoaPods
        # The AMap pod is a large binary download; the cache key follows Podfile.lock.
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-pods-${{ hashFiles('apps/ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-
      - name: Install CocoaPods dependencies
        run: cd apps/ios && pod install
      - name: Build iOS simulator target
        # The workspace remains the recommended build entry point because it
        # includes the generated Pods project. The Podfile also removes the
        # empty aggregate link so the bare RAI.xcodeproj remains buildable.
        run: |
          xcodebuild -workspace apps/ios/RAI.xcworkspace -scheme RAI \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            CODE_SIGNING_ALLOWED=NO build
      - name: Run iOS model regression tests
        run: bash apps/ios/tests/run-model-tests.sh
      - name: Compile visual acceptance UI tests
        # 只编译、不运行。截图回归跑不了：它依赖 `var/rai.sqlite` 这份真实健康库
        # （`.gitignore` 掉 `var/`，且含个人健康数据，不该入库），
        # `run-visual-tests.sh` 的第一步就是 `sqlite3 .backup` 它。所以 UI 用例只能在本机跑。
        # 但"用例编译不过"——写错 API、签名对不上、语法错——CI 必须能发现：此前这一步
        # 完全缺失，`VisualAcceptance.swift` 写错语法时 CI 一路全绿，只有本机跑 UI 回归才暴露。
        # `generic/platform=iOS Simulator` 不解析具体机型，避免 runner 上没有某个 iPhone 型号。
        run: |
          xcodebuild -project apps/ios/tests/VisualAcceptance.xcodeproj -scheme VisualAcceptance \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/visual-acceptance" \
            CODE_SIGNING_ALLOWED=NO build-for-testing

  windows-runtime:
    runs-on: windows-latest
    timeout-minutes: 12

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Windows unit and integration tests
        run: npm test

      - name: Build production Web application
        run: npm run build

      - name: Smoke test production API startup and shutdown
        run: npm run smoke:api

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/requirements.lock

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Validate maintained documentation and acceptance references
        run: npm run check:docs && npm run check:acceptance-matrix

      - name: Run tests
        run: npm test

      - name: Bootstrap Python training environment
        run: npm run ml:bootstrap

      - name: Run Python training tests
        run: npm run ml:test

      - name: Build and test desktop Web flows
        run: npm run test:e2e:web

      - name: Smoke test production API startup and shutdown
        run: npm run smoke:api

      - name: Verify production-only startup contract
        run: |
          npm ci --omit=dev
          test ! -e node_modules/.bin/vite
          npm run smoke:api
