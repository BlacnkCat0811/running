# Cloud /etc/nginx/sites-available/rai. Replace domain AND certificate paths.
# This replaces the old cloud API site; do not enable both for the same domain.
limit_req_zone $binary_remote_addr zone=rai_home_api:1m rate=5r/s;

server {
    listen 80;
    server_name rai.example.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://rai.example.com$request_uri; }
}

server {
    listen 443 ssl;
    server_name rai.example.com;
    ssl_certificate /etc/letsencrypt/live/rai.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rai.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;
    client_body_timeout 60s;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    # No health paths, request bodies, or Authorization headers in access logs.
    access_log off;
    error_log /var/log/nginx/rai-error.log warn;

    # The API is the only origin now; it no longer serves a Web build.
    # 2026-10-18（深度审查 P3-34）：与主模板 deploy/nginx-rai.conf 对齐 ——
    # 只反代 /v1；站点根路径与任何静态资源一律 404（此前这里是 catch-all 透传，
    # 任何未来新增的非 /v1 路由都会被意外暴露到公网）；robots.txt 由 nginx 直接回答。
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_request_buffering off;
    proxy_buffering off;
    # Never implicitly retry a write/upload against another upstream.
    proxy_next_upstream off;
    limit_req_status 429;

    # 健康数据不该被搜索引擎收录；robots 由 nginx 直接回答（与主模板同文案）。
    location = /robots.txt {
        add_header Content-Type text/plain always;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location = /v1/imports/uploads {
        limit_req zone=rai_home_api burst=20 nodelay;
        client_max_body_size 4g;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_pass http://127.0.0.1:18787;
    }
    location /v1/ {
        limit_req zone=rai_home_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:18787;
    }
    # Web 退役后不存在任何页面/静态资源：其余路径一律 404（不再 catch-all 透传）。
    location / { return 404; }
}
