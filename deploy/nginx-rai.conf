server {
    # Bootstrap over HTTP; certbot --nginx adds the HTTPS listener and redirect.
    listen 80;
    server_name rai.example.com;

    client_max_body_size 4g;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location ^~ /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/html;
    }

    # The API uses its own Bearer token. Nginx injects it for the browser shell
    # while the iOS shell sends the same token itself.
    location /v1/ {
        auth_basic off;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization "Bearer replace-with-the-same-token-as-/etc/rai/rai.env";
        proxy_request_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
    }
}
