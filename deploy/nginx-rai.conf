# RAI 生产站点 Nginx 配置模板（v2，与线上 2026-09 拓扑一致）
#
# 拓扑要点：
#   - 后端 rai-api 只监听 127.0.0.1:8787（RAI_API_HOST/RAI_API_PORT 可覆盖）。
#   - Nginx 直接托管 `apps/web/dist` 静态产物并提供 SPA 回退；
#     iOS 调试壳（WKWebView）与浏览器打开的都是这份静态 Web。
#   - 仅 /v1/* 反代到后端，并**透传客户端自己的 `Authorization: Bearer <token>`**
#     （不做 proxy_set_header 注入、不做 auth_basic —— WKWebView 无法处理 Basic Auth
#     弹窗，iOS 壳与浏览器都依赖 API 层的 Bearer 校验）。
#   - 后端 local-request-security 统一校验 Bearer 与请求上下文；未带 Token 的 /v1
#     请求返回 401。
#   - 桌面浏览器直接打开站点时 SPA 没有 Token（无 iOS 壳注入），页面可加载但 /v1
#     数据请求会 401；正式使用以 iOS 壳（自动注入 Token）为主。
#
# 请把 `rai.example.com` 换成真实域名、把 dist 路径换成实际部署目录。

server {
    listen 80;
    server_name rai.example.com;
    # certbot --nginx 会在此加入 HTTPS listener 与 80→443 跳转；
    # 手工签发时保留下面的 ACME webroot 块：
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name rai.example.com;

    # certbot --nginx 自动填入证书路径；手工部署时替换：
    # ssl_certificate     /etc/letsencrypt/live/rai.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/rai.example.com/privkey.pem;

    client_max_body_size 4g;          # Apple Health ZIP 上传（/v1/imports/uploads）
    proxy_read_timeout 3600s;         # 导入/重算长请求
    proxy_send_timeout 3600s;

    root /opt/rai/apps/web/dist;      # 部署目录，按实际调整
    index index.html;

    # API：仅透传 /v1/*，不做 Basic Auth / Token 注入
    location /v1/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
    }

    # SPA 静态资源与深链接回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}

