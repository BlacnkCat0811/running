# RAI 生产站点 Nginx 配置模板（v4：Web SPA 已退役，只反代 API）
#
# 拓扑要点：
#   - 后端 rai-api 只监听 127.0.0.1:8787（RAI_API_HOST/RAI_API_PORT 可覆盖）。
#   - 本模板不托管任何静态文件：站点根路径 404，只有 /v1/* 反代到后端。
#   - 客户端只有原生 iOS App（SwiftUI）：它直接请求 /v1，不加载网页，也不发
#     Origin/CORS 预检；Token 由 App 以 Authorization: Bearer 携带。
#   - 仅 /v1/* 反代到后端，并**透传客户端自己的 `Authorization: Bearer <token>`**
#     （不做 proxy_set_header 注入、不做 auth_basic —— Basic Auth 弹窗不属于产品交互，
#      iOS 应用依赖 API 层的 Bearer 校验）。
#   - 后端 local-request-security 统一校验 Bearer 与请求上下文；云上必须配置
#     RAI_API_TOKEN，否则经 Nginx 转发后 Host 不再是 loopback，请求会被判 403。
#
# 默认鉴权：每个 /v1 请求都要 Token。
#
# 匿名只读模式（RAI_PUBLIC_HOSTS）原本是给浏览器 SPA「打开即看」用的；Web 退役后
# 不再需要，无特殊需求请保持为空。2026-10-18 起即使配置，匿名可读范围也只有
# GET /v1/health、GET /v1/handshake、GET /v1/runtime-status（业务读一律 Token）。
#
# 请把 `rai.example.com` 换成真实域名。

# 本文件由 sites-enabled 包含，顶层指令落在 http 上下文，故 zone / log_format 可直接声明。
# 5 r/s 对正常 App 轮询无感，对爬虫/异常客户端是硬闸。
limit_req_zone $binary_remote_addr zone=rai_read:10m rate=300r/m;
limit_req_status 429;

# 2026-10-18（生产 -1001 复盘）：Ubuntu 默认 combined 不含耗时，事故时只能数到 499 的条数，
# 看不出「这条挂了 15 s」。自定义格式把状态码、总耗时、上游耗时/状态/地址都写出来：
#   rt=    客户端到 nginx 的总耗时（含排队与上游）
#   urt=   上游响应耗时；"-" = 上游一个字节都没回（hang 的典型形态）
#   ust=   上游返回的状态码；"-" = 响应由 nginx 自己生成
#   uaddr= 实际连接的上游地址
# 判读：499 + rt≈15 = 客户端自己超时（iOS 15 s → -1001）；499 + rt<1 = 用户切页/取消；
#       504 = nginx 等满 proxy_read_timeout（默认 120s，见 443 server 块）才放弃。
log_format rai '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent '
               'rt=$request_time urt=$upstream_response_time ust=$upstream_status '
               'uaddr=$upstream_addr ua="$http_user_agent"';

server {
    listen 80;
    server_name rai.example.com;
    # certbot --nginx 会在此加入 HTTPS listener 与 80→443 跳转；
    # 手工签发时保留下面的 ACME webroot 块：
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name rai.example.com;

    # certbot --nginx 自动填入证书路径；手工部署时替换：
    # ssl_certificate     /etc/letsencrypt/live/rai.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/rai.example.com/privkey.pem;

    # 默认收紧：只有上传端点需要大 body（下面单独放宽）。
    client_max_body_size 1m;
    # 2026-10-18（-1001 复盘）：3600s 会把「后端无响应」藏成客户端自己的 15 s 超时（-1001），
    # nginx 既不产生 504、也不写 error.log。120s 是「上限」而不是期望延迟：
    # 客户端 15 s 先超时仍会留下 499 + rt≈15（可复盘），挂住的请求最多占连接 120s。
    # 真正 >120s 的 hang 由 systemd watchdog 兜底重启（deploy/rai-api.service 的 WatchdogSec）。
    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    # 复盘日志：本 server 块只写 rai-access.log（不再写默认 access.log；排障命令见
    # deploy/README-UBUNTU.md「验证」与 docs/OPERATIONS.md「看 rt=/urt= 与 499/504」）。
    access_log /var/log/nginx/rai-access.log rai;

    # 健康数据不该被搜索引擎收录。
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location = /robots.txt {
        add_header Content-Type text/plain always;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # API：仅透传 /v1/*，不做 Basic Auth / Token 注入
    location /v1/ {
        limit_req zone=rai_read burst=100 nodelay;

        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
    }

    # 备份下载/恢复（运维窗口动作）。恢复要替换整个库文件，可能远超默认 120s；
    # 504 不会中止服务器上的恢复，只会让执行方误判失败，所以这里保留 600s。
    location ^~ /v1/backups {
        limit_req zone=rai_read burst=100 nodelay;

        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Apple Health ZIP 上传（iOS 后台 URLSession）。
    # 这个 location 必须在上面的前缀匹配之外单独放行，否则会被 1m 拦掉。
    # 上限必须 ≥ API 的 RAI_IMPORT_MAX_ZIP_BYTES（默认 64 MiB）；4g 是「不小于」的
    # 宽松值，收紧时两处必须同步。
    # 已知长读例外只有这里与上面的 /v1/backups（600s）；新增长读路由请单独列
    # location，不要放宽前缀默认的 120s。
    location = /v1/imports/uploads {
        limit_req zone=rai_read burst=100 nodelay;
        client_max_body_size 4g;

        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Web 退役后不存在任何页面/静态资源：其余路径一律 404。
    location / { return 404; }
}

