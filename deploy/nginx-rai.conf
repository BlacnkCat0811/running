# RAI 生产站点 Nginx 配置模板（v3，与线上 2026-09 拓扑一致）
#
# 拓扑要点：
#   - 后端 rai-api 只监听 127.0.0.1:8787（RAI_API_HOST/RAI_API_PORT 可覆盖）。
#   - Nginx 直接托管 `apps/web/dist` 静态产物并提供 SPA 回退；
#     iOS 调试壳（WKWebView）与浏览器打开的都是这份静态 Web。
#   - 仅 /v1/* 反代到后端，并**透传客户端自己的 `Authorization: Bearer <token>`**
#     （不做 proxy_set_header 注入、不做 auth_basic —— WKWebView 无法处理 Basic Auth
#     弹窗，iOS 壳与浏览器都依赖 API 层的 Bearer 校验）。
#   - 后端 local-request-security 统一校验 Bearer 与请求上下文。
#
# 默认鉴权（未设 RAI_PUBLIC_HOSTS）：每个 /v1 请求都要 Token，浏览器直接打开
# 站点会加载页面但数据请求 401。这是本模板的默认安全姿态。
#
# 匿名只读模式（设 RAI_PUBLIC_HOSTS=<本域名> 后）：
#   - 白名单里的 GET 读路由可无 Token 访问，前端打开即看；
#   - 写请求（POST/PUT/PATCH/DELETE）与备份/诊断/导入源等敏感 GET 仍要 Token；
#   - 下面的 limit_req 是这套模式的配套闸门：读接口公开后，限速是防批量抓取
#     与流量包超额的第一道防线，与 RAI_PUBLIC_HOSTS 同开同关。
#
# 请把 `rai.example.com` 换成真实域名、把 dist 路径换成实际部署目录。

# 本文件由 sites-enabled 包含，顶层指令落在 http 上下文，故 zone 可直接声明。
# 5 r/s 对正常浏览（含 /v1/runtime-status 轮询）无感，对爬虫是硬闸。
limit_req_zone $binary_remote_addr zone=rai_read:10m rate=300r/m;
limit_req_status 429;

server {
    listen 80;
    server_name rai.example.com;
    # certbot --nginx 会在此加入 HTTPS listener 与 80→443 跳转；
    # 手工签发时保留下面的 ACME webroot 块：
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name rai.example.com;

    # certbot --nginx 自动填入证书路径；手工部署时替换：
    # ssl_certificate     /etc/letsencrypt/live/rai.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/rai.example.com/privkey.pem;

    # 默认收紧：只有上传端点需要大 body（下面单独放宽）。
    # 匿名只读开启后，公网可匿名发起写请求的机会变多，不该再默认放行 4g。
    client_max_body_size 1m;
    proxy_read_timeout 3600s;         # 导入/重算长请求
    proxy_send_timeout 3600s;

    root /opt/rai/apps/web/dist;      # 部署目录，按实际调整
    index index.html;

    # 健康数据不该被搜索引擎收录。SPA 是 JS 渲染，爬虫本来看不到内容，
    # 但显式标注后可以避免链接与元信息被索引。
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location = /robots.txt {
        add_header Content-Type text/plain always;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # API：仅透传 /v1/*，不做 Basic Auth / Token 注入
    location /v1/ {
        limit_req zone=rai_read burst=100 nodelay;

        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
    }

    # Apple Health ZIP 上传（唯一的 4g 端点）。
    # 这个 location 必须在上面的前缀匹配之外单独放行，否则会被 1m 拦掉。
    location = /v1/imports/uploads {
        limit_req zone=rai_read burst=100 nodelay;
        client_max_body_size 4g;

        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
    }

    # Serve only public build resources. Never expose arbitrary files copied
    # into dist, source maps, hidden files or symlink targets.
    location = /index.html { disable_symlinks on; try_files /index.html =404; }
    location = /favicon.ico { return 204; }
    location ~ ^/assets/(?:[A-Za-z0-9_-][A-Za-z0-9_.-]*/)*[A-Za-z0-9_-][A-Za-z0-9_.-]*\.(?:js|css|png|jpg|jpeg|webp|svg|ico|woff|woff2)$ {
        disable_symlinks on;
        try_files $uri =404;
    }
    location ~ ^/(?:workouts(?:/[^/.]+)?|zones|statistics|trends|predictions|data(?:/audit)?|settings|more|week|body|ios)?/?$ {
        disable_symlinks on;
        try_files /index.html =404;
    }
    location / { return 404; }
}

