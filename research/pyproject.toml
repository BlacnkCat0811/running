[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rai-race-residual-training"
version = "0.1.0"
description = "Deterministic CatBoost/ONNX training pipeline for RAI race-time residuals"
requires-python = ">=3.12,<3.14"
dependencies = [
  "catboost==1.2.8",
  "numpy==2.1.3",
  "onnx==1.18.0",
  "onnxruntime==1.22.1",
]

[project.optional-dependencies]
test = ["pytest==8.3.4"]

[project.scripts]
rai-train-race-residual = "rai_ml.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["rai_ml*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
